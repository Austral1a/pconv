[package]
name = "pconv"
version = "0.1.0"
edition = "2021"
description = "Convert images from one format to another."

[features]
default = ["heic"]
heic = ["dep:libheif-rs"]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
glob = "0.3"
icns = "0.5"
image = { version = "0.25", default-features = false, features = [
    "avif",
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
imagepipe = "0.5"
jpeg2k = { version = "0.10", default-features = false, features = [
    "file-io",
    "image",
    "openjp2",
] }
jxl-oxide = { version = "0.12", features = ["image"] }
libheif-rs = { version = "2", optional = true }
psd = "0.3"
# Enable assembly in the shared rav1e used by image/ravif (faster AVIF encodes).
rav1e = { version = "0.8", default-features = false, features = ["asm"] }
# Encode AVIF via ravif directly (10-bit). image::AvifEncoder forces 8-bit and looks worse.
ravif = { version = "0.13", default-features = false, features = ["asm", "threading"] }
resvg = "0.45"
rgb = { version = "0.8", default-features = false }
webp = { version = "0.3", default-features = true, features = ["img"] }
zune-core = "0.5"
zune-jpegxl = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
